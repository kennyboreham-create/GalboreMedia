name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required for GitHub Pages deployments via GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; skip runs queued between an
# in-progress run and the latest queued run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # With a custom domain the site is served at "/"; otherwise it is served
        # from the project subpath on <owner>.github.io.
        env:
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN != '' && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      # Bind the site to a custom domain (e.g. a GoDaddy domain) by setting the
      # repository Actions variable CUSTOM_DOMAIN (Settings -> Secrets and
      # variables -> Actions -> Variables). When unset, the site publishes to
      # the default <owner>.github.io/<repo>/ URL instead.
      - name: Configure custom domain
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME

      # Single-page fallback so deep links resolve to the app entry point.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
